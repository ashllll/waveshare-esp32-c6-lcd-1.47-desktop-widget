    <text x="12" y="168" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#718092">IP 192.168.31.8</text>
    <text x="308" y="168" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#718092">IKUAI LIVE</text>
