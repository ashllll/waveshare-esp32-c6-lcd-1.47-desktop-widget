    <text x="21" y="33" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#718092">DOWNLOAD</text>
    <rect x="172" y="23" width="3" height="11" fill="#6AA8FF"/>
    <text x="181" y="33" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#718092">UPLOAD</text>

    <text x="12" y="66" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="36" fill="#F4F7FA">9.36</text>
    <text x="103" y="62" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#50E3C2">MB/s</text>
    <text x="172" y="66" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="36" fill="#F4F7FA">1.02</text>
    <text x="263" y="62" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6AA8FF">MB/s</text>

    <rect x="159" y="24" width="1" height="47" fill="#172330"/>

    <!-- 趋势图面板 -->
    <rect x="10" y="82" width="300" height="74" rx="8" fill="#091018" stroke="#172330" stroke-width="1"/>
    <text x="19" y="95" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#718092">10S LIVE</text>
    <text x="111" y="95" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#50E3C2">DOWN</text>
    <text x="175" y="95" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6AA8FF">UP</text>
    <text x="219" y="95" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#FFB454">PING</text>

    <!-- 曲线区网格(298x45,起于 11,105) -->
    <line x1="11" y1="116" x2="309" y2="116" stroke="#13202A" stroke-width="1"/>
    <line x1="11" y1="128" x2="309" y2="128" stroke="#13202A" stroke-width="1"/>
    <line x1="11" y1="140" x2="309" y2="140" stroke="#13202A" stroke-width="1"/>

    <!-- 下行曲线(青) -->
    <path d="M11,138 C30,136 42,118 62,116 C82,114 92,130 112,132 C132,134 142,114 162,112 C182,110 192,124 212,127 C232,130 242,109 262,113 C282,117 292,126 309,124"
