<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="576" viewBox="0 0 340 192">
  <!-- 机身边框 -->
  <rect x="0" y="0" width="340" height="192" rx="14" fill="#16191d"/>
  <rect x="0" y="0" width="340" height="192" rx="14" fill="none" stroke="#2a2f35" stroke-width="1"/>
  <!-- 屏幕 320x172(横屏) -->
  <g transform="translate(10,10)">
