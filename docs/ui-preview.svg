    <!-- PING 曲线(橙,平稳带一次小抖动) -->
    <path d="M11,136 L80,136 C95,136 100,135 115,135 L145,135 C152,135 155,119 162,120 C169,121 171,135 179,135 L250,135 C270,136 290,135 309,135"
          fill="none" stroke="#FFB454" stroke-width="1.5"/>

