; Waveshare ESP32-C6-LCD-1.47 - 桌面信息摆件（时钟 + 天气）
; ESP32-C6FH8, ST7789 172x320 SPI LCD, WS2812 RGB

[env:esp32-c6-lcd]
platform = espressif32@7.0.1
board = esp32-c6-devkitc-1
framework = espidf

; 8MB Flash 芯片，app 分区 3MB
board_build.partitions = partitions.csv

; Upload & Monitor
upload_speed = 921600
monitor_speed = 115200
upload_port = /dev/cu.usbmodem141401
monitor_port = /dev/cu.usbmodem141401
